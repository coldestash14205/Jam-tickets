<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jam Radio · Support Ticket</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ticket-container">
    <button 
      id="themeToggle" 
      class="theme-toggle" 
      type="button"
      aria-label="Toggle dark mode"
      title="Toggle dark mode"
    >
      <span class="theme-icon">🌙</span>
    </button>

    <div class="header">
      <div class="header-icon">🎫</div>
      <h1>
        Create ticket
        <span>jam.radio support · we reply fast</span>
      </h1>
    </div>

    <form id="ticketForm">
      <div class="form-group">
        <label for="email">
          <span>📧 Your email</span>
          <span class="required">*</span>
        </label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
        <div class="hint"><i>✉️</i> We'll send updates and a chat link to this address.</div>
      </div>

      <div class="form-group">
        <label for="subject">
          <span>📌 Subject</span>
          <span class="required">*</span>
        </label>
        <input type="text" id="subject" name="subject" placeholder="e.g., Audio dropouts on stream" required>
      </div>

      <div class="form-group">
        <label for="message">
          <span>📝 Description</span>
          <span class="required">*</span>
        </label>
        <textarea id="message" name="message" placeholder="Please describe your issue in detail…" required></textarea>
      </div>

      <div class="button-row">
        <button type="submit" class="btn-primary" id="submitBtn">
          <span>✈️</span> Submit ticket
        </button>
        <button type="button" class="btn-secondary" id="resetBtn">
          <span>↺</span> Clear
        </button>
      </div>
    </form>

    <div id="statusMessage" class="status-message">
      <i>✅</i>
      <span id="statusText">Ticket created successfully.</span>
    </div>

    <div class="footer-note">
      <span>🔔</span> Notifications sent to <strong>jam.radio.support@gmail.com</strong> and your inbox.
    </div>
  </div>

  <!-- EmailJS SDK — MUST load before script.js -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
